[package]
name = "mcore"
version = "0.4.0"
edition = "2021"

[lib]
name = "mcore"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"
lto = false
overflow-checks = false

[profile.release]
panic = "abort"
opt-level = 0
lto = false
debug = 1

[dependencies]
shared = { path = "../kernel/shared" }
tock-registers = "0.10"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
bitflags = "1.3"
heapless = "0.7"
spin = "0.9"
ohlink-format = { path = "../tools/ohlink-toolchain/crates/ohlink-format", default-features = false }
libpillsmod = { workspace = true }

[build-dependencies]
rustc_version = "0.4"
