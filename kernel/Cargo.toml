[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "kernel"
crate-type = ["staticlib"]

[features]
default = []

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
opt-level = 0
lto = false

[dependencies]
hal = { path = "../hal" }
shared = { path = "../shared" }
tock-registers = "0.10"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
bitflags = "1.3"
heapless = "0.7"

[build-dependencies]
rustc_version = "0.4"
