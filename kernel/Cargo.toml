[package]
name = "kernel"
version = "0.4.0"
edition = "2021"

[lib]
name = "kernel"
crate-type = ["staticlib"]

[workspace]
members = [
    "shared",
]
resolver = "2"

[profile.dev]
panic = "abort"
lto = false
overflow-checks = false

[profile.release]
panic = "abort"
opt-level = 0
lto = false
debug = 1

[dependencies]
shared = { path = "shared" }
tock-registers = "0.10"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
bitflags = "1.3"
heapless = "0.7"
ohlink-format = { path = "../tools/ohlink-toolchain/crates/ohlink-format", default-features = false }

[build-dependencies]
rustc_version = "0.4"
