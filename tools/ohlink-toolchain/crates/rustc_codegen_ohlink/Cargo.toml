[package]
name = "rustc_codegen_ohlink"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
ohlink-format = { path = "../ohlink-format" }
cranelift-codegen = "0.117.0"
cranelift-module = "0.117.0"
cranelift-jit = "0.117.0"
cranelift-object = "0.117.0"
target-lexicon = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
