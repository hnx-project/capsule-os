[package]
name = "xtask"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
toml = "0.8"
