# xtask Raspberry Pi runtime configuration.
#
# Consumed ONLY by `xtask code run --platform rpi` and the disk-image
# generation branch in `xtask code build --platform rpi`.  Build
# addresses come from `xtask.build.toml`; this file holds what is
# unique to the Pi boot flow:
#   - downloading the official Broadcom firmware once into
#     `build/dist/rpi_firmware_cache/`
#   - laying out the dual-in-one `kernel8.img` (bootloader padded to
#     128 KiB followed by the kernel hnxcore blob)
#   - naming the resulting disk image
#
# `xtask code flash --disk <path>` (writes the image to an SD card)
# is a follow-up; today the user runs `dd` manually.

[platform.aarch64.profiles.rpi.broadcom]
firmware_cache = "build/dist/rpi_firmware_cache"

# Files downloaded once from raspberrypi/firmware on github
[[platform.aarch64.profiles.rpi.broadcom.firmware]]
name = "bootcode.bin"
url  = "https://github.com/raspberrypi/firmware/raw/master/boot/bootcode.bin"

[[platform.aarch64.profiles.rpi.broadcom.firmware]]
name = "start.elf"
url  = "https://github.com/raspberrypi/firmware/raw/master/boot/start.elf"

[[platform.aarch64.profiles.rpi.broadcom.firmware]]
name = "fixup.dat"
url  = "https://github.com/raspberrypi/firmware/raw/master/boot/fixup.dat"

[[platform.aarch64.profiles.rpi.broadcom.firmware]]
name = "start4.elf"
url  = "https://github.com/raspberrypi/firmware/raw/master/boot/start4.elf"

[[platform.aarch64.profiles.rpi.broadcom.firmware]]
name = "fixup4.dat"
url  = "https://github.com/raspberrypi/firmware/raw/master/boot/fixup4.dat"

[platform.aarch64.profiles.rpi.disk]
output_dir         = "build/dist/distribution"
image_arch         = "rpi-aarch64"
bootloader_pad_bytes = 131072

# Stage layout: bootloader (padded) + kernel hnxcore.
# The image_name_template from xtask.toml applies.
[[platform.aarch64.profiles.rpi.disk.stages]]
input  = "build/target/aarch64-unknown-none/release/capsule-bootloader.bin"
pad_to = 131072

[[platform.aarch64.profiles.rpi.disk.stages]]
input = "build/dist/kernel/hnxcore"