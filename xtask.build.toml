# xtask build configuration.
#
# Per-architecture / per-platform:
#   - cross-toolchain target triple
#   - linker script and ld emulation
#   - kernel entry point
#   - boot / kernel / rootfs physical addresses
#
# Plus the [[subprojects]] table: which subprojects to build, in what
# order, with what backend.  Each subproject gets an `enable` flag so
# slow components (e.g. autotools-based foreign builds) can be opted
# out without editing this file.  CLI flag --exclude / --only will
# land in a later release.
#
# Consumed by: `xtask code build`, `xtask code run`, `xtask code test`.

# ----------------------------------------------------------------------------
# aarch64 build profiles
# ----------------------------------------------------------------------------

[platform.aarch64.profiles.virt]
rust_target      = "aarch64-unknown-none"
userspace_target = "libraries/targets/aarch64-unknown-capsule.json"
kernel_entry     = "1074266112"
ld_emulation     = "aarch64elf"
linker_script    = "kernel/linker/kernel_aarch64.ld"
dtb_addr         = "0x42000000"
ohc_addr         = "0x40700000"
boot_addr        = "0x44000000"
rootfs_addr      = "0x46000000"

[platform.aarch64.profiles.rpi]
rust_target      = "aarch64-unknown-none"
userspace_target = "libraries/targets/aarch64-unknown-capsule.json"
kernel_entry     = "1074266112"
ld_emulation     = "aarch64elf"
linker_script    = "kernel/linker/kernel_aarch64.ld"
dtb_addr         = "0x42000000"
ohc_addr         = "0x44010000"
boot_addr        = "0x44000000"
rootfs_addr      = "0x46000000"

# ----------------------------------------------------------------------------
# Subprojects
# ----------------------------------------------------------------------------

[[subprojects]]
name    = "userspace-loader"
type    = "userspace"
enable  = true
crates = [
    { crate_name = "hnx-loader", out_name = "loader", entry = "65536" }
]
staging_bin_dir = "build/dist/loader_rootfs/system/bin"
rootfs_output   = "kernel/files/loader.img"

[[subprojects]]
name    = "kernel-pills"
type    = "pills"
enable  = true
crates = [
    { crate_name = "hnx-inputd", out_name = "inputd", entry = "65536", config_path = "kernel/src/pillsmod/inputd/configs" },
    { crate_name = "hnx-graphicd", out_name = "graphicd", entry = "65536", config_path = "kernel/src/pillsmod/graphicd/configs" },
    { crate_name = "hnx-touchd", out_name = "touchd", entry = "65536", config_path = "kernel/src/pillsmod/touchd/configs" }
]
staging_bin_dir = "build/dist/staging_rootfs/system/lib/pills"

[[subprojects]]
name    = "userspace-apps"
type    = "userspace"
enable  = true
crates = [
    { crate_name = "hnx-devmgr", out_name = "devmgr", entry = "65536", config_path = "userspace/services/devmgr/configs" },
    { crate_name = "hnx-blkdev", out_name = "blkdev", entry = "65536", config_path = "userspace/services/blkdev/configs" },
    { crate_name = "hnx-fileagent", out_name = "fileagent", entry = "65536", config_path = "userspace/services/fileagent/configs" },
    { crate_name = "hnx-procmgr", out_name = "procmgr", entry = "65536", config_path = "userspace/services/procmgr/configs" },
    { crate_name = "hnx-tty", out_name = "tty", entry = "65536", config_path = "userspace/services/tty/configs" },
    { crate_name = "hnx-servicesd", out_name = "servicesd", entry = "65536" },
    { crate_name = "hnx-netd", out_name = "netd", entry = "65536", config_path = "userspace/services/netd/configs" },
    { crate_name = "hnx-osh", out_name = "osh", entry = "65536", config_path = "userspace/programs/osh/configs" },
    { crate_name = "hnx-ls", out_name = "ls", entry = "65536" },
    { crate_name = "hnx-cat", out_name = "cat", entry = "65536" },
    { crate_name = "hnx-mkdir", out_name = "mkdir", entry = "65536" },
    { crate_name = "hnx-touch", out_name = "touch", entry = "65536" },
    { crate_name = "hnx-rm", out_name = "rm", entry = "65536" },
    { crate_name = "hnx-rmdir", out_name = "rmdir", entry = "65536" },
    { crate_name = "hnx-ps", out_name = "ps", entry = "65536" },
    { crate_name = "hnx-kill", out_name = "kill", entry = "65536" },
    { crate_name = "hnx-testall", out_name = "testall", entry = "65536", config_path = "userspace/programs/testall/configs" },
    { crate_name = "hnx-dmesg", out_name = "dmesg", entry = "65536", config_path = "userspace/programs/dmesg/configs" }
]
staging_bin_dir = "build/dist/staging_rootfs/system/bin"
rootfs_output   = "kernel/files/rootfs.img"
etc_source      = "kernel/files/etc"
etc_target      = "build/dist/staging_rootfs/etc"

[[subprojects]]
name    = "kernel"
type    = "kernel"
enable  = true
path    = "kernel"
package = "kernel"
link_output = "build/dist/kernel/kernel.elf"
raw_output  = "build/dist/kernel/kernel.raw"
ohc_output  = "build/dist/kernel/hnxcore"

[[subprojects]]
name    = "bootloader"
type    = "bootloader"
enable  = true
package = "capsule-bootloader"
bin_output = "build/target/{rust_target}/release/capsule-bootloader.bin"

# ----------------------------------------------------------------------------
# Reserved: foreign-built subproject slots.
#
# `type = "foreign"` subprojects are built outside the cargo workspace
# (autotools / cmake / gnu-make) and OHLK-packed into the staging
# rootfs by an xtask arm that lands in a follow-up release.  Until then
# the slot is recorded but no-op'd at build time so `xtask code build`
# stays fast.
# ----------------------------------------------------------------------------

[[subprojects]]
name         = "bash"
type         = "foreign"
enable       = false
src_path     = "userspace/posix/bash"
configure    = "./capsule-configure.sh"
build        = "make -j$(nproc)"
artifact     = "userspace/posix/bash/bash"
ohlink_entry = "65536"
staging_bin  = "build/dist/staging_rootfs/system/bin/bash"
