[workspace]
members = [
    "capsule-bootloader",
    # userspace | capsuleOS
    "userspace/libc",
    "userspace/services/vfs",
    "userspace/services/loader",
    "userspace/services/init",
    "userspace/programs/shell",
]

[workspace.package]
version = "0.1.0-pangu"

resolver = "2"

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
opt-level = 0
lto = false
