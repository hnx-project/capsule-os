[workspace.package]
version = "1.0.0-beta4"
edition = "2021"

[workspace.dependencies]
libc = { path = "libraries/libc" }
libstd = { path = "libraries/libstd" }
libcapsule = { path = "libraries/libcapsule" }
pillskit = { path = "libraries/pillskit" }
modskit = { path = "libraries/modskit" }

[workspace]
members = [
    "bootloader",
    "tools/xtask",
    "tools/toolchain/crates/ohlink-format",
    "tools/toolchain/crates/ohlink-linker",
    "tools/toolchain/crates/ohlink-read",
    # libraries | CapsuleOS runtime contract
    "libraries/libc",
    "libraries/libstd",
    "libraries/libcapsule",
    "libraries/libtty",
    "libraries/pillskit",
    "libraries/modskit",
    # services | CapsuleOS system services
    "services/devmgr",
    "services/loader",
    "services/procmgr",
    "services/tty",
    "services/servicesd",
    "services/netd",
    "services/piped",
    "services/fileagent",
    # pills | Kernel Extensions
    "pillsmod/inputd",
    "pillsmod/graphicd",
    "pillsmod/touchd",
    "pillsmod/blkdev",
    "pillsmod/mockd",
    # apps | CapsuleOS user applications
    "apps/shell/osh",
    "apps/utilities/ls",
    "apps/utilities/cat",
    "apps/utilities/mkdir",
    "apps/utilities/touch",
    "apps/utilities/rm",
    "apps/utilities/rmdir",
    "apps/utilities/ps",
    "apps/utilities/kill",
    "apps/utilities/testall",
    "apps/utilities/dmesg",
]

resolver = "2"

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
opt-level = 0
lto = false
debug = 1
