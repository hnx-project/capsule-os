[workspace.package]
version = "0.5.9-develop"
edition = "2021"

[workspace]
members = [
    "bootloader",
    "tools/xtask",
    "tools/ohlink-toolchain/crates/ohlink-format",
    "tools/ohlink-toolchain/crates/ohlink-linker",
    "tools/ohlink-toolchain/crates/ohlink-read",
    # userspace | capsuleOS
    "userspace/hnxlibc",
    "userspace/hnxstd",
    "userspace/services/devmgr",
    "userspace/services/fileagent",
    "userspace/services/loader",
    "userspace/services/init",
    "userspace/programs/shell",
    "userspace/programs/osh",
    "userspace/programs/ls",
    "userspace/programs/cat",
    "userspace/programs/mkdir",
    "userspace/programs/touch",
    "userspace/programs/rm",
    "userspace/programs/rmdir",
    "userspace/programs/ps",
    "userspace/programs/kill",
]

resolver = "2"

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
opt-level = 0
lto = false
