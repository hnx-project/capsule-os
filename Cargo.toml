[workspace]
members = [
    "capsule-bootloader",
    # kernel | HNX
    "hal",
    "shared",
    "kernel",
    # userspace | capsuleOS
    "userspace/libc",
    "userspace/services/vfs",
    "userspace/services/loader",
    "userspace/services/init",
    "userspace/programs/shell",
    # userspace - display | capsuleOS
    "display/compositor",
    "display/renderer",
    "display/client",
    # tools | HNX
    "tools/ohc-tool",
]
resolver = "2"

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
opt-level = 0
lto = false
