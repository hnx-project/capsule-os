[package]
name = "hnx-netd"
version.workspace = true
edition.workspace = true

[[bin]]
name = "netd"
path = "src/main.rs"

[dependencies]
libcapsule = { path = "../../../libraries/libcapsule", package = "libcapsule", features = ["runtime"] }
shared = { path = "../../../kernel/shared" }
smoltcp = { version = "0.11.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-raw"] }

[features]
capsule = []
