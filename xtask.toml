# CapsuleOS xtask Unified Configuration File
#
# This file holds ONLY cross-cutting metadata:
#   - project name / version / codename / target dir
#   - upstream remotes (gitcode)
#   - foreign subtree remotes (kernel / bootloader / posix)
#   - toolchain bootstrap (host-side cargo build of ohlink-toolchain)
#   - toolchain linker (ohlink-linker package for OHLK packing)
#   - distribution image name template
#
# Architecture / platform / build addresses live in `xtask.build.toml`.
# QEMU-only run arguments live in `xtask.qemu.toml`.
# Raspberry Pi run helpers live in `xtask.rpi.toml`.
#
# Any of those runtime-config files can be overridden with
# `xtask code <cmd> --config <path>.toml`.

[project]
name = "capsuleOS"
codename = "Pangu"
version = "1.0.0-beta4"      # Overrides Cargo.toml version if present
target_dir = "build/target"  # Target folder for compilation output

[gitcode]
upstream_owner = "hnx-project"
upstream_repo = "capsule-os"

[submodules]
"kernel"     = { upstream = "git@gitcode.com:hnx-project/hnx-core.git",          fork_repo = "hnx-core" }
"bootloader" = { upstream = "git@gitcode.com:hnx-project/capsule-bootloader.git", fork_repo = "bootloader" }
"bash"       = { upstream = "git@gitcode.com:hnx-project/capsule-bash.git",       fork_repo = "bash" }

[toolchain]
bootstrap = [
    { name = "ohlink-toolchain", path = "tools/ohlink-toolchain/Cargo.toml", release = true }
]
linker = { path = "tools/ohlink-toolchain/Cargo.toml", package = "ohlink-linker" }

[distribution]
output_dir = "build/dist/distribution"
image_name_template = "{project_name}-{codename}-{version}-{arch}-{date}.img"